---
name: Testing

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        python-version:
          - '3.6'
          - '3.7'
          - '3.8'
          - '3.9'
          - '3.10'
          - '3.11'
          # - '3.12'  # FixMe: https://github.com/pylint-dev/pylint-pytest/issues/3
        exclude:
          # Too old Pythons for `ubuntu-latest`
          - python-version: '3.6'
            os: ubuntu-latest
          - python-version: '3.7'
            os: ubuntu-latest
          # Too old Pythons for `macos-latest` aka arm64
          - python-version: '3.6'
            os: macos-latest
          - python-version: '3.7'
            os: macos-latest
        include:
          # Github does not provide `ubuntu-20.04` anymore
          # - python-version: '3.6'
          #   os: ubuntu-20.04
          - python-version: '3.7'
            os: ubuntu-22.04
          - python-version: '3.6'
            os: macos-15-intel
          - python-version: '3.7'
            os: macos-15-intel

    defaults:
      run:
        shell: 'bash --noprofile --norc -Eeuxo pipefail {0}'

    steps:
      - uses: actions/checkout@v3

      - name: Slugify GITHUB_REPOSITORY
        run: echo "GITHUB_REPOSITORY_SLUG=${GITHUB_REPOSITORY////_}" >> $GITHUB_ENV

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: setup.py

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install tox

      - name: Test with tox
        env:
          FORCE_COLOR: 1
          PYTEST_CI_ARGS: --cov-report=xml --junitxml=test_artifacts/test_report.xml --color=yes
        run: |
          py=py$(echo '${{ matrix.python-version }}' | tr -d .)
          tox -e "$(tox -l | grep "^${py}-" | paste -sd, -)"

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@v3
        with:
          # For Mac:
          # v0.7.3: Mach-O 64-bit x86_64 executable
          # v0.8.0: Mach-O 64-bit arm64 executable
          version: ${{ matrix.os == 'macos-15-intel' && 'v0.7.3' || 'latest' }}
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: ${{ matrix.os }},${{ matrix.python-version }}
          fail_ci_if_error: true
          files: test_artifacts/cobertura.xml

      - name: Create artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ env.GITHUB_REPOSITORY_SLUG }}_test-artifacts_${{ github.event_name }}_${{ github.event.pull_request.number || github.sha }}_${{ matrix.os
            }}_py${{ matrix.python-version }}
          path: test_artifacts/
